[project]
name = "whisper-http"
version = "0.1.0"
description = "Flask service orchestrating whisper diarization with fallback transcription"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0.0,<4.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "rich>=13.5.0,<14.0.0",
    "python-json-logger>=2.0.7,<3.0.0",
    "faster-whisper>=1.0.0,<2.0.0",
    "srt>=3.5.3,<4.0.0",
    "numpy<2.3",
    "tokenizers>=0.21,<0.22",
    "pytest>=7.4.0,<9.0.0"
]

[tool.ruff]
exclude = [
    "external",
    "docs/diarize.py",
]

